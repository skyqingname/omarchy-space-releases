[package]
name = "omarchy-desktop"
version = "0.1.0"
description = "Local Omarchy environment with Claude Code and sing-box"
edition = "2021"

[lib]
name = "omarchy_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
flate2 = "1.1"
url = "2.5.8"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_yaml_ng = "0.10"
uuid = { version = "1", features = ["v4"] }
arboard = { version = "3", default-features = false }
dunce = "1.0.5"
portable-pty = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
